const { useState, useMemo } = React;

/* ---- palette (espelha o painel oficial) ---- */
const NAVY = "#1F3B57", INK = "#16293D", GOLD = "#8A6D1D", BURG = "#7A1F1F";
const CREAM = "#FAF7EE", MIST = "#F4F7F9", LINE = "#E4DCC8", MUTED = "#5A6B7B";
const serif = { fontFamily: "Georgia, 'Times New Roman', serif" };

const TOTAL = LISTA.length; // 237
const byCl = Object.fromEntries(LISTA.map((r) => [r.cl, r]));
const convTot = LISTA.reduce((a, r) => a + r.fP, 0);
const saidTot = LISTA.reduce((a, r) => a + r.fN, 0);
const suplTot = LISTA.reduce((a, r) => a + r.fO, 0);
const saldo = convTot + suplTot;
const estrelas = LISTA.filter((r) => r.apr && r.apr !== "—").length;
const filaAtiva = LISTA.filter((r) => /fila ativa/i.test(String(r.status))).length;

function statusStyle(s) {
  const t = String(s || "").toUpperCase();
  if (t.includes("CONVOCADO")) return { c: "#1E6B3A", bg: "#EAF6EC" };
  if (t.includes("SUPLEMENT")) return { c: "#2E7D8A", bg: "#E1F0F2" };
  if (t.includes("SAI")) return { c: "#B3261E", bg: "#F9E6E4" };
  if (t.includes("MIGRA")) return { c: "#2E5AAC", bg: "#E7ECF7" };
  if (t.includes("PROV")) return { c: "#B8860B", bg: "#FBF1D8" };
  if (t.includes("DESIST")) return { c: "#B56576", bg: "#F6E7EA" };
  return { c: GOLD, bg: "#FFF3D6" };
}
const fmtNota = (n) => (n == null ? "—" : String(n).replace(".", ","));

/* ---- small building blocks ---- */
function Band({ children, n }) {
  return (
    <div style={{ background: INK }} className="px-3 py-1.5 flex items-center gap-2 rounded-t-md">
      {n && <span style={{ ...serif, color: GOLD }} className="text-sm font-bold">{n}</span>}
      <span style={{ ...serif }} className="text-white t13 font-bold tracking-wide uppercase">{children}</span>
    </div>
  );
}
function Row({ label, children, strong }) {
  return (
    <div className="flex items-baseline justify-between gap-3 px-3 py7 border-b" style={{ borderColor: "#EDE9DC" }}>
      <span style={{ color: MUTED }} className="t125">{label}</span>
      <span style={{ color: strong ? GOLD : "#1A2733", ...(strong ? serif : {}) }}
            className={"text-right t13 " + (strong ? "font-bold t15" : "font-semibold")}>
        {children}
      </span>
    </div>
  );
}
function Card({ children, className = "" }) {
  return <div className={"bg-white rounded-md shadow-sm border " + className} style={{ borderColor: LINE }}>{children}</div>;
}

/* ============================ CONSULTA ============================ */
function Consulta({ cl, setCl }) {
  const [q, setQ] = useState("");
  const matches = useMemo(() => {
    const s = q.trim().toLowerCase();
    if (s.length < 2) return [];
    return LISTA.filter((r) => String(r.nome).toLowerCase().includes(s)).slice(0, 6);
  }, [q]);
  const r = byCl[cl];

  const stepClamp = (v) => setCl(Math.max(1, Math.min(TOTAL, v || 1)));
  const ss = r ? statusStyle(r.status) : null;
  const fillPct = r ? Math.round((r.pos / TOTAL) * 100) : 0;
  const aFrente = r ? r.cl - 1 : 0;

  return (
    <div className="space-y-3">
      {/* input hero */}
      <Card className="overflow-hidden">
        <div style={{ background: NAVY }} className="px-4 py-3 flex flex-wrap items-center gap-3 justify-between">
          <div style={{ ...serif }} className="text-white t15 font-bold tracking-wide">
            CONSULTAR CLASSIFICAÇÃO <span style={{ color: "#B9C6D3" }} className="font-normal">(1–{TOTAL})</span>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => stepClamp(cl - 1)} aria-label="anterior"
              style={{ background: "#2C4B69", color: "#fff" }} className="w-9 h-9 rounded text-lg leading-none">−</button>
            <input type="number" value={cl} min={1} max={TOTAL}
              onChange={(e) => stepClamp(parseInt(e.target.value, 10))}
              style={{ ...serif, color: GOLD, background: CREAM, borderColor: GOLD }}
              className="w-24 h-11 text-center text-2xl font-bold rounded border-2 outline-none" />
            <button onClick={() => stepClamp(cl + 1)} aria-label="próximo"
              style={{ background: "#2C4B69", color: "#fff" }} className="w-9 h-9 rounded text-lg leading-none">+</button>
          </div>
        </div>
        {/* name search */}
        <div className="px-4 py-2.5 relative" style={{ background: MIST }}>
          <input value={q} onChange={(e) => setQ(e.target.value)}
            placeholder="ou busque pelo nome…"
            className="w-full h-9 px-3 rounded border t13 outline-none bg-white"
            style={{ borderColor: LINE }} />
          {matches.length > 0 && (
            <div className="absolute left-4 right-4 z-10 mt-1 bg-white rounded-md shadow-lg border overflow-hidden" style={{ borderColor: LINE }}>
              {matches.map((m) => (
                <button key={m.cl} onClick={() => { setCl(m.cl); setQ(""); }}
                  className="w-full text-left px-3 py-2 hover:bg-slate-50 flex justify-between items-center border-b last:border-0"
                  style={{ borderColor: "#F0ECE0" }}>
                  <span className="t13 text-slate-700 truncate pr-2">{m.nome}</span>
                  <span style={{ color: GOLD }} className="t12 font-bold shrink-0">Cl. {m.cl}</span>
                </button>
              ))}
            </div>
          )}
        </div>
      </Card>

      {!r ? (
        <Card><div className="p-6 text-center text-slate-500 text-sm">Digite uma classificação de 1 a {TOTAL}.</div></Card>
      ) : (
        <>
          {/* HERO — posição efetiva */}
          <Card className="overflow-hidden">
            <Band>Posição efetiva estimada</Band>
            <div className="px-4 pt-3 pb-4 text-center">
              <div style={{ ...serif, color: GOLD }} className="font-bold leading-none" >
                <span className="text-6xl">{r.pos}</span>
              </div>
              <div style={{ color: MUTED }} className="t12 mt-1">
                posição {r.pos} de {TOTAL} · quanto menor, mais perto da convocação
              </div>
              {/* queue bar */}
              <div className="mt-3 h-3 rounded-full overflow-hidden" style={{ background: "#E7ECF0" }}>
                <div className="h-full rounded-full" style={{ width: `${fillPct}%`, background: `linear-gradient(90deg,${NAVY},${GOLD})` }} />
              </div>
              {/* decomposition */}
              <div className="grid grid-cols-4 gap-2 mt-4 text-center">
                {[
                  ["Candidatos à frente", aFrente, "#1A2733"],
                  ["Convocados à frente", r.conv_ahead, "#1E6B3A"],
                  ["Saídas/migr. à frente", r.said_ahead, "#B3261E"],
                  ["Suplementares à frente", r.supl_ahead, "#2E7D8A"],
                ].map(([lab, val, col]) => (
                  <div key={lab} className="rounded-md py-2" style={{ background: MIST }}>
                    <div style={{ ...serif, color: col }} className="text-xl font-bold">{val}</div>
                    <div style={{ color: MUTED }} className="t105 leading-tight mt-0.5 px-1">{lab}</div>
                  </div>
                ))}
              </div>
              <div style={{ color: MUTED }} className="t11 mt-3 leading-snug text-left">
                Posição efetiva = classificação {r.cl} − ({r.conv_ahead} convocados + {r.said_ahead} saídas/migrações + {r.supl_ahead} suplementares à frente). Saídas e migrações liberam vagas preenchidas por suplementares logo abaixo.
              </div>
            </div>
          </Card>

          <div className="grid md:grid-cols-2 gap-3">
            {/* Identificação */}
            <Card className="overflow-hidden">
              <Band>Identificação</Band>
              <Row label="Nome"><span className="block mw220 truncate" title={r.nome}>{r.nome}</span></Row>
              <Row label="Nascimento">{r.nasc}</Row>
              <Row label="Situação / cotas">{r.sit}</Row>
              <Row label="Nota final" strong>{fmtNota(r.nota)}</Row>
            </Card>

            {/* Status */}
            <Card className="overflow-hidden">
              <Band>Status de convocação</Band>
              <div className="flex items-center justify-between gap-3 px-3 py7 border-b" style={{ borderColor: "#EDE9DC" }}>
                <span style={{ color: MUTED }} className="t125">Status atual</span>
                <span style={{ color: ss.c, background: ss.bg }} className="t12 font-bold px-2 py-0.5 rounded">{r.status}</span>
              </div>
              <Row label="Canal / convocação">{r.canal}</Row>
              <Row label="Aprovação em Analista">
                <span className="block mw210 truncate text-right" title={r.apr}>{r.apr}</span>
              </Row>
              <Row label="Observações">
                <span className="block mw210 truncate text-right" title={r.obs}>{r.obs}</span>
              </Row>
            </Card>
          </div>

          {/* Notas FGV */}
          <Card className="overflow-hidden">
            <Band>Notas da prova objetiva · FGV</Band>
            <div className="grid grid-cols-2">
              <Row label="Língua Portuguesa">{fmtNota(r.port)}</Row>
              <Row label="Legisl. / Ética">{fmtNota(r.legis)}</Row>
              <Row label="Conhec. Específicos">{fmtNota(r.esp)}</Row>
              <Row label="Nota objetiva" strong>{fmtNota(r.nota)}</Row>
            </div>
          </Card>

          {/* Desempate */}
          <Card className="overflow-hidden">
            <Band>Desempate — critérios do edital (item 14)</Band>
            <div className="px-3 py-3 space-y-1.5">
              <div style={{ ...serif, color: NAVY }} className="t14 font-bold">{r.empate}</div>
              {r.frente !== "—" && <div className="t125 text-slate-700">{r.frente}</div>}
              {r.prox !== "—" && <div className="t125 text-slate-700">{r.prox}</div>}
              {r.migobs !== "—" && <div className="t12 italic" style={{ color: r.mig ? GOLD : MUTED }}>{r.migobs}</div>}
              <div style={{ color: MUTED }} className="t11 pt-1 border-t mt-1" >
                Ordem do art. 14.1: (a) idade ≥ 60 · (b) maior nota objetiva · (c) mais acertos em Conh. Específicos · (d) função de jurado · (e) mais velho.
              </div>
            </div>
          </Card>
        </>
      )}
    </div>
  );
}

/* ============================ PROJEÇÃO ============================ */
function Slider({ label, val, set, note }) {
  return (
    <div className="px-3 py-2.5 border-b" style={{ borderColor: "#EDE9DC" }}>
      <div className="flex items-center justify-between">
        <span style={{ color: "#1A2733" }} className="t13">{label}</span>
        <span style={{ ...serif, color: GOLD, background: "#FFF3D6" }} className="t14 font-bold px-2 py-0.5 rounded">{Math.round(val * 100)}%</span>
      </div>
      <input type="range" min={0} max={100} value={Math.round(val * 100)}
        onChange={(e) => set(parseInt(e.target.value, 10) / 100)}
        className="w-full mt-2 accgold" style={{ accentColor: GOLD }} />
      <div style={{ color: MUTED }} className="t11">{note}</div>
    </div>
  );
}

function Projecao({ cl }) {
  const [base, setBase] = useState(2750);
  const [pr, setPr] = useState(0.40);
  const [pt, setPt] = useState(0.40);
  const [ph, setPh] = useState(0.10);
  const [meses, setMeses] = useState(5);

  const real = Math.round(base * pr * pt * ph);
  const vel = meses > 0 ? Math.round(real / meses) : 0;
  const glob = Math.round(base * 0.08);
  const globVel = meses > 0 ? Math.round(glob / meses) : 0;

  const r = byCl[cl];
  const mesesAte = r && vel > 0 ? Math.ceil(r.pos / vel) : null;

  return (
    <div className="space-y-3">
      {/* hero real */}
      <Card className="overflow-hidden">
        <Band n="→">Projeção real · Hipo Técnico 1ªR</Band>
        <div className="px-4 py-4 grid grid-cols-2 gap-4 items-center">
          <div className="text-center">
            <div style={{ ...serif, color: NAVY }} className="text-6xl font-bold leading-none">{real}</div>
            <div style={{ color: MUTED }} className="t12 mt-1">convocações em {meses} meses</div>
          </div>
          <div className="text-center border-l" style={{ borderColor: LINE }}>
            <div style={{ ...serif, color: GOLD }} className="text-4xl font-bold leading-none">~{vel}</div>
            <div style={{ color: MUTED }} className="t12 mt-1">posições / mês</div>
          </div>
        </div>
        <div className="px-4 pb-3 t11" style={{ color: MUTED }}>
          Padrão conservador: base {base.toLocaleString("pt-BR")} × {Math.round(pr*100)}% (região) × {Math.round(pt*100)}% (Técnico) × {Math.round(ph*100)}% (Hipo).
        </div>
      </Card>

      {/* levers */}
      <Card className="overflow-hidden">
        <Band>Ajustar premissas</Band>
        <div className="px-3 py-2.5 border-b flex items-center justify-between" style={{ borderColor: "#EDE9DC" }}>
          <span className="t13" style={{ color: "#1A2733" }}>Base — convocações totais TJRJ (5m)</span>
          <input type="number" value={base} onChange={(e) => setBase(Math.max(0, parseInt(e.target.value, 10) || 0))}
            className="w-24 h-8 text-center rounded border t13 font-semibold" style={{ borderColor: LINE, color: NAVY }} />
        </div>
        <Slider label="% Região — 1ªR sobre o total" val={pr} set={setPr} note="padrão conservador" />
        <Slider label="% Técnico — dentro da 1ªR" val={pt} set={setPt} note="padrão conservador" />
        <Slider label="% Hipo — reserva no Técnico 1ªR" val={ph} set={setPh} note="reserva da cota" />
        <div className="px-3 py-2.5 flex items-center justify-between">
          <span className="t13" style={{ color: "#1A2733" }}>Janela (meses)</span>
          <input type="number" value={meses} min={1} onChange={(e) => setMeses(Math.max(1, parseInt(e.target.value, 10) || 1))}
            className="w-20 h-8 text-center rounded border t13 font-semibold" style={{ borderColor: LINE, color: NAVY }} />
        </div>
      </Card>

      {/* bridge to consulted position */}
      {r && (
        <Card className="overflow-hidden">
          <div className="px-4 py-3" style={{ background: CREAM }}>
            <div className="t12" style={{ color: MUTED }}>No ritmo real de ~{vel}/mês, a posição efetiva</div>
            <div className="flex items-baseline gap-2 mt-0.5">
              <span style={{ ...serif, color: NAVY }} className="text-2xl font-bold">{r.pos}</span>
              <span className="t13" style={{ color: "#1A2733" }}>(Cl. {r.cl} · {String(r.nome).split(" ")[0]})</span>
              <span className="t13" style={{ color: MUTED }}>seria alcançada em</span>
              <span style={{ ...serif, color: GOLD }} className="text-2xl font-bold">≈ {mesesAte}</span>
              <span className="t13" style={{ color: MUTED }}>{mesesAte === 1 ? "mês" : "meses"}</span>
            </div>
            <div className="t105 mt-1" style={{ color: MUTED }}>
              Estimativa ilustrativa sob premissas conservadoras — não é garantia de convocação. Ritmo e reservas variam conforme os editais.
            </div>
          </div>
        </Card>
      )}

      {/* mobility snapshot */}
      <Card className="overflow-hidden">
        <Band>Mobilidade da lista (registro atual)</Band>
        <div className="grid grid-cols-3 sm:grid-cols-6 gap-px" style={{ background: "#EDE9DC" }}>
          {[
            ["Convocados", convTot, "#1E6B3A"], ["Saídas/migr.", saidTot, "#B3261E"],
            ["Suplementares", suplTot, "#2E7D8A"], ["Saldo real", saldo, NAVY],
            ["Também Analista ★", estrelas, GOLD], ["Na fila ativa", filaAtiva, MUTED],
          ].map(([lab, val, col]) => (
            <div key={lab} className="bg-white py-2.5 text-center">
              <div style={{ ...serif, color: col }} className="text-xl font-bold">{val}</div>
              <div style={{ color: MUTED }} className="t10 leading-tight px-1">{lab}</div>
            </div>
          ))}
        </div>
      </Card>

      {/* gray illustrative */}
      <Card className="overflow-hidden" >
        <div style={{ background: "#ECEDEF" }} className="px-3 py-1.5 rounded-t-md">
          <span style={{ ...serif, color: "#8A94A0" }} className="t12 font-bold italic uppercase tracking-wide">
            Cenário global ilustrativo — não usar p/ 1ªR
          </span>
        </div>
        <div className="px-4 py-3 flex items-center justify-between" style={{ background: "#F2F3F4" }}>
          <div className="t12" style={{ color: "#9AA5AF" }}>
            Blend único de 8% sobre a base ({base.toLocaleString("pt-BR")})
          </div>
          <div className="text-right">
            <span style={{ ...serif, color: "#9AA5AF" }} className="text-2xl font-bold">{glob}</span>
            <span className="t12 ml-2" style={{ color: "#9AA5AF" }}>· ~{globVel}/mês</span>
          </div>
        </div>
        <div className="px-4 py-2 t105" style={{ color: "#9AA5AF", background: "#F2F3F4" }}>
          Não representa a 1ªR e não deve ser usado para estimar a fila — mostrado apenas como comparação.
        </div>
      </Card>
    </div>
  );
}

/* ============================ APP ============================ */
function App() {
  const [view, setView] = useState("posicao");
  const [cl, setCl] = useState(100);

  return (
    <div className="min-h-screen w-full pb-10" style={{ background: "#EEE9DC" }}>
      <style>{`
.t10{font-size:10px}.t105{font-size:10.5px}.t11{font-size:11px}.t12{font-size:12px}
.t125{font-size:12.5px}.t13{font-size:13px}.t14{font-size:14px}.t15{font-size:15px}
.t22{font-size:22px}.t26{font-size:26px}
.py7{padding-top:7px;padding-bottom:7px}
.mw210{max-width:210px}.mw220{max-width:220px}
.accgold{accent-color:#8A6D1D}
`}</style>
      <div className="max-w-2xl mx-auto px-3 pt-4">
        {/* header */}
        <header className="mb-3">
          <h1 style={{ ...serif, color: NAVY }} className="t22 sm:t26 font-bold leading-tight">
            Consulta da Fila — TJRJ Hipossuficiência
          </h1>
          <p style={{ color: GOLD, ...serif }} className="t125 italic mt-0.5">
            Técnico de Atividade Judiciária · 1ª Região · {TOTAL} aprovados · atualizado em 14/07/2026
          </p>
        </header>

        {/* tabs */}
        <div className="flex gap-1 mb-3 p-1 rounded-lg" style={{ background: INK }}>
          {[["posicao", "Minha posição"], ["projecao", "Projeção da fila"]].map(([k, lab]) => (
            <button key={k} onClick={() => setView(k)}
              className="flex-1 py-2 rounded-md t13 font-bold transition-colors"
              style={view === k ? { background: CREAM, color: NAVY, ...serif } : { color: "#9FB1C2" }}>
              {lab}
            </button>
          ))}
        </div>

        {view === "posicao" ? <Consulta cl={cl} setCl={setCl} /> : <Projecao cl={cl} />}

        <footer className="mt-5 text-center t11 leading-relaxed" style={{ color: MUTED }}>
          Ferramenta de consulta pessoal. Números conforme o registro da comissão em 14/07/2026; a lista oficial pode ter atualizações posteriores. Estimativas de projeção são ilustrativas e não constituem garantia de convocação.
        </footer>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
