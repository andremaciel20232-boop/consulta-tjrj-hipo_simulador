<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAF7EE;--navy:#1F3B57;--dark:#16293D;--gold:#8A6D1D;--line:#E4DCC8;--ink:#1A2733;--muted:#5A6B7B;--green:#1E6B3A;--rose:#B56576;--blue:#2E5AAC;--orange:#B45309;--tile:#F4F7F9}
body{background:var(--bg);color:var(--ink);font-family:Carlito,Calibri,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased}
.wrap{max-width:430px;margin:0 auto;padding:16px 16px 40px}
.serif{font-family:'DejaVu Serif',Georgia,'Times New Roman',serif}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--dark);padding:4px;border-radius:10px;margin-bottom:14px}
.tabs button{border:0;background:transparent;color:#9FB1C2;font:700 12.5px Carlito,Calibri,sans-serif;padding:8px 0;border-radius:7px;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--navy)}
h1{font-family:'DejaVu Serif',Georgia,serif;font-size:21px;color:var(--navy);line-height:1.15;margin-bottom:3px}
.sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:11px}
.band{background:var(--dark);color:#fff;font-family:'DejaVu Serif',Georgia,serif;font-weight:700;font-size:12.5px;padding:7px 12px;letter-spacing:.02em;text-transform:uppercase}
.in{padding:10px 12px}
.lbl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.slabel{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);font-weight:700;margin-bottom:6px}
.num{font-family:'DejaVu Serif',Georgia,serif;font-weight:700}
.navy{color:var(--navy)}.gold{color:var(--gold)}.green{color:var(--green)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.last{background:var(--dark);color:#fff;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:14px;margin-bottom:11px}
.last .n{font-family:'DejaVu Serif',Georgia,serif;font-weight:700;font-size:34px;color:#D9B867;line-height:1}
.last .t{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#C9D4DF;margin-bottom:3px}
.last .nm{font-size:13.5px;font-weight:700}
.last .st{font-size:11px;color:#E9B57A;margin-top:2px}
.search{display:flex;align-items:center;gap:9px;background:#fff;border:2px solid var(--navy);border-radius:12px;padding:11px 13px;box-shadow:0 0 0 4px #EEF2F6;margin-bottom:12px}
.search .ic{font-size:17px;color:var(--navy);line-height:1}
.search input{flex:1;min-width:0;border:0;outline:0;font:14px Carlito,Calibri,sans-serif;color:var(--ink);background:transparent}
.search input::placeholder{color:#7A8794}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chips button{font:11.5px Carlito,Calibri,sans-serif;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fff;cursor:pointer}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lrow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 12px;border:0;border-bottom:1px solid #F0ECE0;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.lrow .cl{font-family:'DejaVu Serif',Georgia,serif;font-weight:700;color:var(--gold);font-size:15px}
.lrow .ef{font-size:10.5px;color:var(--muted)}
.lrow .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .sb{font-size:10.5px;color:var(--muted)}
.empty{font-size:12.5px;color:var(--muted);text-align:center;padding:18px}
.foot{font-size:11.5px;color:var(--muted);text-align:center;padding:9px;background:var(--tile)}
.pick{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.pick input{flex:1;min-width:0;font:700 16px Carlito,Calibri,sans-serif;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.pick button{font:700 13px Carlito,Calibri,sans-serif;padding:10px 14px;border-radius:8px;border:0;background:var(--navy);color:#fff;cursor:pointer}
.ofi{text-align:center;padding:16px 12px 14px}
.ofi .big{font-family:'DejaVu Serif',Georgia,serif;font-weight:700;font-size:64px;line-height:1;color:var(--navy)}
.ofi .name{font-size:14px;font-weight:700;margin-top:8px}
.ofi .chip{margin-top:8px}
.efet{background:#DCE7F8;border-color:#9DB7DE}
.efet .band{background:var(--blue)}
.efet .big{font-family:'DejaVu Serif',Georgia,serif;font-weight:700;font-size:58px;line-height:1;color:var(--blue);text-align:center}
.fila{background:#FFE9D2;border-color:#E9B57A}
.fila .band{background:var(--orange)}
.fila .big{font-family:'DejaVu Serif',Georgia,serif;font-weight:700;font-size:58px;line-height:1;color:var(--orange);text-align:center}
.cap{font-size:12px;margin-top:6px;text-align:center}
.bar{height:10px;border-radius:999px;background:#fff;overflow:hidden;margin:10px 0 0}
.bar i{display:block;height:100%;background:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #EDE9DC}
.grid div{text-align:center;padding:9px 2px;border-right:1px solid #EDE9DC;border-bottom:1px solid #EDE9DC}
.grid div:nth-child(3n){border-right:0}
.grid b{display:block;font-family:'DejaVu Serif',Georgia,serif;font-size:18px}
.grid small{font-size:10px;color:var(--muted);line-height:1.2;display:block;padding:0 3px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 12px;border-bottom:1px solid #EDE9DC;font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted);font-size:12.5px}
.row .v{font-weight:700;text-align:right}
.note{font-size:10.5px;color:var(--muted);line-height:1.4;padding:8px 12px;background:var(--tile)}
.hero{display:grid;grid-template-columns:1fr 1fr}
.hero>div{padding:14px 10px;text-align:center}
.hero>div+div{border-left:1px solid #EDE9DC}
.hero .big{font-family:'DejaVu Serif',Georgia,serif;font-size:44px;font-weight:700;line-height:1}
.hero .cap2{font-size:11.5px;color:var(--muted);margin-top:4px}
.slider{padding:10px 12px;border-bottom:1px solid #EDE9DC}
.slider .top{display:flex;justify-content:space-between;font-size:13px;align-items:center}
.pct{font-family:'DejaVu Serif',Georgia,serif;font-weight:700;color:var(--gold);background:#FFF3D6;padding:1px 8px;border-radius:5px}
.slider input{width:100%;margin-top:6px;accent-color:#8A6D1D}
.gray{background:#ECEDEF;color:#8A94A0}
.seg{display:flex;flex-wrap:nowrap;height:26px;border-radius:6px;overflow:hidden;margin:12px 0 8px}
.seg i{flex:1 1 0;min-width:0;border-right:1px solid #fff}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.res div{background:var(--tile);border-radius:8px;padding:10px}
.res .k{font-size:10.5px;color:var(--muted);margin-bottom:4px}
.res .v{font-size:14px;font-weight:700;line-height:1.3}
.res .s{font-size:11px;color:var(--muted);margin-top:2px}
.nrow{display:grid;grid-template-columns:1fr 112px 46px;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #EDE9DC}
.nrow:last-child{border-bottom:0}
.nrow .rl{font-size:13px;font-weight:700}
.nrow .rl small{display:block;font-size:10.5px;font-weight:400;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.stp{display:flex;align-items:center;justify-content:space-between;background:var(--tile);border-radius:8px;padding:3px}

.acc{text-align:right;font-size:13px;color:var(--muted)}

.stat{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}

.pendbox{margin-top:12px;background:#FFF1B8;color:#6B5212;font-size:12px;padding:9px 11px;border-radius:8px}

.tile{border-radius:10px;padding:12px;color:#fff}
.tile.navy{background:#16293D}
.tile.gold{background:#8A6D1D}

.tile .v{font-family:'DejaVu Serif',Georgia,serif;font-size:22px;font-weight:700;line-height:1.15;margin-top:4px}
.tile .s{font-size:11.5px;opacity:.9;margin-top:3px}
.grp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 12px}
.grp div{text-align:center;background:var(--tile);border-radius:8px;padding:8px 2px}
.grp b{display:block;font-family:'DejaVu Serif',Georgia,serif;font-size:18px}
.grp small{font-size:10.5px;color:var(--muted)}
.grp .tot{background:var(--navy)}
.grp .tot b,.grp .tot small{color:#fff}
.legend span{white-space:nowrap}
.res .tile *{background:none!important;padding:0!important;border-radius:0!important;margin-bottom:0}
.res .tile .v{margin-top:4px}

.tag .emo{text-decoration:none}
.tag{letter-spacing:.01em}
.modbar{margin-bottom:11px}
.modlink{width:100%;font:700 12.5px Carlito,Calibri,sans-serif;color:var(--gold);background:#fff;border:1.5px dashed var(--gold);border-radius:10px;padding:9px;cursor:pointer}
.modlogin,.modbar.on{background:#fff;border:2px solid var(--gold);border-radius:12px;padding:12px}
.modlogin input,.modrow input{width:100%;font:15px Carlito,Calibri,sans-serif;padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin:2px 0 10px;background:#fff;color:var(--ink)}
.modtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.modtop b{font-family:'DejaVu Serif',Georgia,serif;color:var(--gold);font-size:14px}
.modtop span{font-size:11.5px;color:var(--muted)}
.modrow{display:block;font-size:11.5px;color:var(--muted)}

.modhint{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.35}
.modbtns{display:flex;gap:8px;flex-wrap:wrap}
.modbtns button{font:700 12.5px Carlito,Calibri,sans-serif;padding:9px 13px;border-radius:8px;border:0;background:var(--navy);color:#fff;cursor:pointer}

.stsel{max-width:132px;font:700 10.5px Carlito,Calibri,sans-serif;padding:5px 3px;border:1px solid var(--gold);border-radius:6px;background:#fff;color:var(--ink)}
</style>

function build(over){
  let out = 0, fn = 0;
  const rows = DATA.map(r => {
    const status = over[r.cl] || r.status;
    const fila = status === 'Na fila ativa';
    const pe = fila ? r.cl - out : null;
    if (OUTS(status)) out++;
    return {...r, status, fila, pe, fn: fila ? ++fn : null, k: kind(status)};
  });
  const qmap = {}; rows.forEach(r => { if (r.fn != null) qmap[r.fn] = r; });
  return {ROWS: rows, QMAP: qmap, MAXQ: fn};
}

function ModBar(){
  const {mod} = useData();
  const [open, setOpen] = useState(false);
  const [tk, setTk] = useState('');
  if (!mod.on) return (
    <div className="modbar">
      {!open
        ? <button className="modlink" onClick={()=>setOpen(true)}>🔒 Acesso do moderador</button>
        : <div className="modlogin">
            <div className="slabel">Acesso do moderador</div>
            <input type="password" autoComplete="off" value={tk} placeholder="Cole aqui o token do moderador" onChange={e=>setTk(e.target.value)} />
            <div className="modbtns">
              <button onClick={()=>mod.login(tk.trim())} disabled={mod.busy || !tk.trim()}>{mod.busy ? 'Verificando…' : 'Entrar'}</button>
              <button className="ghost" onClick={()=>{setOpen(false);setTk('');}}>Cancelar</button>
            </div>
            {mod.msg && <div className="modmsg err">{mod.msg}</div>}
          </div>}
    </div>);
  const n = Object.keys(mod.pending).length + (mod.ultP!=null ? 1 : 0);
  return (
    <div className="modbar on">
      <div className="modtop"><b>Modo moderador</b><span>{n ? `${n} alteração(ões) não publicada(s)` : 'sem alterações pendentes'}</span></div>

      <div className="modbtns">
        <button onClick={mod.publish} disabled={mod.busy || !n}>{mod.busy ? 'Publicando…' : 'Publicar para todos'}</button>
        <button className="ghost" onClick={mod.discard} disabled={!n || mod.busy}>Descartar</button>

      </div>
      {mod.msg && <div className={'modmsg ' + (mod.ok ? 'ok' : 'err')}>{mod.msg}</div>}

}

// ---------- ABA SIMULADOR ----------
const SCOL = ['#1F3B57','#2E5AAC','#0F766E','#B8860B','#1E6B3A'];
const GLAB = ['G6','G7','G8','G9','G10'];
const GRUPOS_ALL = ['G1/G2','G3','G4','G5','G6','G7','G8','G9','G10'];
const gcount = (rows, g) => rows.filter(r => r.status.startsWith('CONVOCADO '+g+' ')).length;
// Arredondamento: se a casa das unidades for 6 ou mais, soma-se +1 (16→17, 26→27, 36→37…)
const adj = n => (n % 10) >= 6 ? 1 : 0;

function Simulador({cl, setCl}){
  const {ROWS, QMAP, MAXQ} = useData();
  const [draft, setDraft] = useState(cl==null ? '' : String(cl));
  React.useEffect(() => { setDraft(cl==null ? '' : String(cl)); }, [cl]);
  const [nom, setNom] = useState(NOM0);
  const eff = nom.map(n => n + adj(n));
  const acc = []; eff.reduce((s,n,i)=>(acc[i]=s+n, s+n), 0);
  const TOT = acc[acc.length-1];
  const DES = Math.ceil(TOT/0.9);
  const REACH = QMAP[Math.min(TOT,MAXQ)];
  const REACH_D = QMAP[Math.min(DES,MAXQ)];
  const me = ROWS.find(x => x.cl===cl);
  const USERQ = me && me.fn!=null ? me.fn : null;
  const prevIdx = USERQ!=null && TOT>0 ? acc.findIndex(a => a>=USERQ) : -1;
  const setN = (i, d) => setNom(nom.map((v,j) => j===i ? Math.max(0, Math.min(300, v+d)) : v));
  const segs = [];
  for (let p=1; p<=MAXQ; p++){
    let st;
    if (p<=TOT) st = {background: SCOL[acc.findIndex(a => p<=a)]};
    else if (p<=DES) st = {background:'repeating-linear-gradient(45deg,#B56576 0 2px,transparent 2px 4px)'};
    else st = {background:'#E7E3D6'};
    if (p===USERQ) st = {...st, outline:'2px solid #8A6D1D', outlineOffset:'1px', position:'relative', zIndex:2};
    segs.push(<i key={p} style={st} />);
  }
  const counts = GRUPOS_ALL.map(g => gcount(ROWS, g));
  let lastG = 3; counts.forEach((c,i) => { if (c>0 && i>lastG) lastG = i; });   // mostra G1–G5 e, se houver, os grupos seguintes
  const shown = GRUPOS_ALL.slice(0, lastG+1);
  const totG = counts.slice(0, lastG+1).reduce((a,b)=>a+b, 0);
  const gMax = lastG + 2;
  return (<>
    <h1>Simulador de Convocações</h1>
    <div className="sub">Cota Hipossuficiência 1ª Região<br/>Dados atualizados em 30/10/2026 · cota Hipo 1ªR</div>
    <div className="card"><div className="band">Resultado do cenário simulado</div><div className="in">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
        <div className="num navy" style={{fontSize:56,lineHeight:1}}>{TOT}</div>
        <div style={{textAlign:'right',fontSize:12,color:'#5A6B7B',lineHeight:1.45}}>nomeações simuladas<br/>alcança <b style={{color:'#1A2733'}}>{Math.round(TOT/MAXQ*100)}%</b> da fila ativa<br/>({TOT} de {MAXQ})</div>
      </div>
      <div className="seg">{segs}</div>
      <div className="legend">
        {GLAB.map((g,i)=><span key={g}><i className="sw" style={{background:SCOL[i]}}></i>{g}</span>)}
        <span><i className="sw" style={{background:'#B56576'}}></i>+10% desist.</span>
        <span><i className="sw" style={{background:'#E7E3D6'}}></i>além</span>
        {USERQ!=null && <span><i className="sw" style={{background:'#8A6D1D'}}></i>você (#{USERQ})</span>}
      </div>
      <div className="res">
        <div className="tile navy"><div className="k">Último alcançado</div><div className="v">{REACH ? `Cl. ${REACH.cl}` : '—'}</div><div className="s">{REACH ? REACH.nome : ''}</div></div>
        <div className="tile gold"><div className="k">Com 10% de desistência</div><div className="v">{REACH_D ? `roda até Cl. ${REACH_D.cl}` : '—'}</div><div className="s">{REACH_D ? REACH_D.nome : ''}</div></div>
      </div>
    </div></div>
    <div className="card"><div className="band">Nº de convocações realizadas · (G1-G{gMax})</div>
      <div className="grp" style={{gridTemplateColumns:'repeat('+Math.min(shown.length+1,5)+',1fr)'}}>
        {shown.map(g => <div key={g}><b>{gcount(ROWS, g)}</b><small>{g}</small></div>)}
        <div className="tot"><b>{totG}</b><small>total</small></div>
      </div></div>
    <div className="card"><div className="band">Simular novas convocações · (G6-G10)</div>
      {NOM0.map((_, i) => (
        <div className="nrow" key={i}>
          <div className="rl"><span className="dot" style={{background:SCOL[i]}}></span>{GLAB[i]}<small>calendário a confirmar</small></div>
          <div className="stp"><button onClick={()=>setN(i,-1)}>−</button><span>{nom[i]}</span><button onClick={()=>setN(i,1)}>+</button></div>
          <div className="acc">{acc[i]}</div>
        </div>))}
    </div>
    <div className="card"><div className="band">Sua posição</div>
      <div className="in">
        <div className="slabel">Digite sua classificação oficial</div>
        <div className="pick" style={{marginBottom:0}}>
          <input type="number" min="1" max={ROWS.length} value={draft} placeholder="Ex.: 152"
            onChange={e=>setDraft(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter'){ const n=parseInt(draft,10); if(n>=1&&n<=ROWS.length) setCl(n);} }} />
          <button onClick={()=>{ const n=parseInt(draft,10); if(n>=1&&n<=ROWS.length) setCl(n); }}>Simular</button>
        </div>
      </div>
      {cl!=null && <div className="you"><div><div className="cl">Cl. {cl}</div>
        <div style={{fontSize:11.5,color:'#5A6B7B'}}>{USERQ!=null ? `fila ativa #${USERQ}` : 'fora da fila ativa'}</div>
        <div style={{fontSize:11.5,color:'#5A6B7B'}}>{me ? me.nome : ''}</div></div>
        <div className="prev">{USERQ==null ? '—' : TOT===0 ? 'defina as nomeações' : prevIdx>=0 ? <>prevista na<br/>{GLAB[prevIdx]}</> : 'além do cenário'}</div></div>}
    </div>
    <div className="card"><div className="band">Premissas fixas (estimativas)</div>
      <div className="fixed"><span>Alternância Ampla : Hipo</span><span>6 : 1 · ≈ {TOT*6}</span></div>
      <div className="fixed"><span>Taxa de desistência</span><span>10% · {DES} chamadas</span></div>
      <div className="fixed"><span>Conversor 9.1.1 (30 vagas)</span><span>→ 3 à Hipo</span></div>
      <div className="note">Premissas de cenário, não regras confirmadas. Calendário das chamadas a confirmar.</div>
    </div>
  </>);
}

  const [cl, setCl] = useState(null);   // nenhuma posição pré-selecionada
  const [remote, setRemote] = useState({over:{}, ult:ULT0, updated:null});   // o que todos veem
  const [pending, setPending] = useState({});                                // alterações do moderador ainda não publicadas
  const [ultP, setUltP] = useState(null);
  const [token, setToken] = useState(() => { try { return localStorage.getItem('hipo_mod') || ''; } catch(e) { return ''; } });
  const [busy, setBusy] = useState(false), [msg, setMsg] = useState(''), [ok, setOk] = useState(false);

  // lê o status.json publicado (visitantes e moderador)
  const load = async () => {
    try {
      const res = await fetch('status.json?t=' + Date.now(), {cache:'no-store'});
      if (!res.ok) return;
      const j = await res.json();
      setRemote(cur => (j.updated && cur.updated && j.updated < cur.updated) ? cur
        : {over: cleanOver(j.over), ult: (+j.ult>=1 && +j.ult<=DATA.length) ? +j.ult : ULT0, updated: j.updated || null});
    } catch(e) {}
  };
  useEffect(() => {
    load();
    const iv = setInterval(load, 90000);
    const vis = () => { if (document.visibilityState === 'visible') load(); };
    document.addEventListener('visibilitychange', vis);
    return () => { clearInterval(iv); document.removeEventListener('visibilitychange', vis); };
  }, []);

  const over = useMemo(() => cleanOver({...remote.over, ...pending}), [remote, pending]);
  const data = useMemo(() => build(over), [over]);
  const ult = ultP != null ? ultP : remote.ult;

  const mod = {
    on: !!token, busy, msg, ok, pending, ultP, ult,
    setStatus: (c, st) => {
      const curSt = remote.over[c] != null ? remote.over[c] : BASE[c];
      setMsg('');
      setPending(p => { const n = {...p}; if (st === curSt) delete n[c]; else n[c] = st; return n; });
    },
    setUlt: v => { const n = parseInt(v,10); if (n>=1 && n<=DATA.length) { setMsg(''); setUltP(n === remote.ult ? null : n); } },
    discard: () => { setPending({}); setUltP(null); setMsg(''); },
    logout: () => { try { localStorage.removeItem('hipo_mod'); } catch(e) {} setToken(''); setPending({}); setUltP(null); setMsg(''); },
    login: async tk => {
      setBusy(true); setMsg('');
      try {
        const r = await fetch(`https://api.github.com/repos/${REPO}`, {headers: GH(tk)});
        if (!r.ok) throw new Error('Token inválido ou sem acesso a este repositório.');
        const j = await r.json();
        if (!(j.permissions && j.permissions.push)) throw new Error('Este token não tem permissão de escrita.');
        try { localStorage.setItem('hipo_mod', tk); } catch(e) {}
        setToken(tk);
      } catch(e) { setOk(false); setMsg(e.message || 'Erro ao entrar.'); }
      finally { setBusy(false); }
    },
    publish: async () => {
      setBusy(true); setMsg('');
      try {
        const url = `https://api.github.com/repos/${REPO}/contents/${FILE}`;
        for (let attempt = 0; attempt < 2; attempt++) {
          let sha, cur = {};
          const g = await fetch(url + '?ref=main&t=' + Date.now(), {headers: GH(token), cache:'no-store'});
          if (g.ok) { const j = await g.json(); sha = j.sha; try { cur = JSON.parse(b64d(j.content)); } catch(e) {} }
          else if (g.status !== 404) throw new Error(g.status===401||g.status===403 ? 'Sem permissão para publicar. Verifique o token.' : `Falha ao ler o arquivo (${g.status}).`);
          const over2 = cleanOver({...(cur.over || {}), ...pending});
          const body = {v:1, ult: ultP != null ? ultP : ((+cur.ult>=1) ? +cur.ult : remote.ult), over: over2, updated: new Date().toISOString()};
          const p = await fetch(url, {method:'PUT', headers: {...GH(token), 'Content-Type':'application/json'},
            body: JSON.stringify({message:'Atualiza status (moderador)', content: b64e(JSON.stringify(body, null, 1)), sha, branch:'main'})});
          if (p.ok) {
            setRemote({over: over2, ult: body.ult, updated: body.updated}); setPending({}); setUltP(null);
            setOk(true); setMsg('Publicado! Aparece para todos em cerca de 1 minuto.'); return;
          }
          if (p.status !== 409 && p.status !== 422) throw new Error(p.status===401||p.status===403||p.status===404 ? 'Sem permissão para publicar. Verifique o token.' : `Falha ao publicar (${p.status}).`);
        }
        throw new Error('Outra alteração foi publicada ao mesmo tempo. Toque em Publicar de novo.');
      } catch(e) { setOk(false); setMsg(e.message || 'Erro ao publicar.'); }
      finally { setBusy(false); }
    },
  };

  const pick = c => { setCl(c); setTab('posicoes'); window.scrollTo(0,0); };
  return (
    <DataCtx.Provider value={{...data, ult, updated: remote.updated, mod}}>
      <div className="tabs">{TABS.map(([k,l]) =>
        <button key={k} className={tab===k?'on':''} onClick={()=>setTab(k)}>{l}</button>)}</div>
      <div style={{display: tab==='lista' ? 'block' : 'none'}}><Lista onPick={pick} /></div>
      <div style={{display: tab==='posicoes' ? 'block' : 'none'}}><Posicoes cl={cl} setCl={setCl} /></div>
      <div style={{display: tab==='projecoes' ? 'block' : 'none'}}><Projecoes cl={cl} /></div>
      <div style={{display: tab==='simulador' ? 'block' : 'none'}}><Simulador cl={cl} setCl={setCl} /></div>
    </DataCtx.Provider>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
