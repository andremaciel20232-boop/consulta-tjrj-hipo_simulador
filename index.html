function build(over, rp, ult, repsInput){
  let out = 0, fn = 0, maxRep = 0;
  const rows = DATA.map(r => {
    const status = over[r.cl] || r.status;
    const k = kind(status);
    const ultSaida = k === 'prov' && r.cl === ult;                  // último chamado oficial (PROV. ANAL): já foi convocado, conta como saída
    const fila = (status === 'Na fila ativa' || k === 'prov') && !ultSaida;   // quem ainda está na fila (PROV. ANAL só sai quando confirmado)
    const rep = k === 'conv' ? ((r.cl in rp) ? rp[r.cl] : (r.rep || 0)) : 0;
    if (rep > maxRep) maxRep = rep;
    const inq = !OUTS(status) && !ultSaida;                                        // presente na fila efetiva (inclui prováveis e pendências TD)
    const pe = inq ? r.cl - out : null;
    if (!inq) out++;
    // fn = FILA ATIVA (melhor cenário): prováveis contam como se já tivessem desistido
    return {...r, status, fila, ultSaida, pe, fn: status === 'Na fila ativa' ? ++fn : null, k, rep};
  });
  const qmap = {}; let qn = 0; rows.forEach(r => { if (r.pe != null) { qmap[r.pe] = r; qn++; } });
  const reps = Math.max(repsInput, maxRep);          // o contador nunca fica abaixo da maior reposição marcada
  const migN = rows.filter(r => r.k==='mig' && r.cl<=ult).length;
  const desN = rows.filter(r => r.k==='desist' && r.cl<=ult).length;
  const PEND = Math.max(0, migN + desN - reps);
  const cnt = k => rows.filter(r => r.k===k).length;
  return {ROWS: rows, QMAP: qmap, MAXQ: qn, FNMAX: fn, reps, migN, desN, PEND, totConv: cnt('conv'),
          mob: {conv: cnt('conv'), desist: cnt('desist'), pend: cnt('pend'), mig: cnt('mig'), sai: cnt('sai'), prov: cnt('prov'), fila: fn}};
}

// Campo numérico do moderador: ao tocar, o campo esvazia (o valor atual fica de dica);
// o número digitado só vale ao tocar fora ou em OK/Enter. Valor inválido é descartado.
function NumField({value, min, max, onCommit, color}){
  const [txt, setTxt] = useState(String(value));
  const [focus, setFocus] = useState(false);
  useEffect(() => { if (!focus) setTxt(String(value)); }, [value, focus]);
  const commit = () => {
    const n = parseInt(txt, 10);
    const ok = n >= min && n <= max;
    if (ok && n !== value) onCommit(n);
    setFocus(false); setTxt(String(ok ? n : value));
  };
  return <input className="inp" type="text" inputMode="numeric" pattern="[0-9]*" autoComplete="off" enterKeyHint="done"
    style={color ? {color} : undefined} value={txt} placeholder={String(value)}
    onFocus={() => { setFocus(true); setTxt(''); }}
    onChange={e => setTxt(e.target.value.replace(/\D/g, '').slice(0, 3))}
    onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
    onBlur={commit} />;
}

  const go = () => { const n = parseInt(draft,10); if (n>=1 && n<=DATA.length) setCl(n); };
  return [draft, setDraft, go];

function Projecoes({cl}){
  const {ROWS, mob, updated} = useData();
  const [pr, setPr] = useState(40), [pt_, setPt] = useState(40), [ph, setPh] = useState(10);
  const n1 = Math.round(TOTAL_GERAL*pr/100), n2 = Math.round(TOTAL_GERAL*pr/100*pt_/100);
  const real = Math.round(TOTAL_GERAL * pr/100 * pt_/100 * ph/100);
  const vel = Math.round(real/5);
  const glob = Math.round(TOTAL_GERAL*0.08);
  const r = ROWS.find(x => x.cl===cl);
  const pe = r && r.fila ? r.pe : null;
  const meses = pe && vel>0 ? Math.ceil(pe/vel) : null;
  // linha do tempo: tudo até 2 meses depois do seu mês; se ficar longa, recolhe os meses do meio
  const rowsTL = [];
  if (meses){
    const last = Math.min(meses+2, 60);
    const show = last<=9 ? Array.from({length:last}, (_, i) => i+1)
      : [...new Set([1,2, ...Array.from({length:last-Math.max(3,meses-2)+1}, (_, i) => Math.max(3,meses-2)+i)])].sort((a,b)=>a-b);
    let prev = 0;
    show.forEach(m => {
      if (prev && m-prev>1){ const n = m-prev-1;
        rowsTL.push(<div key={'g'+m} className="gap"><span>⋮ {mesLabel(prev+1)} a {mesLabel(m-1)} · {n} {n===1?'mês':'meses'}</span>
          </div>); }
      if (m===6) rowsTL.push(<div key="cut" className="cutm"><span>fim da base de 5 meses · daqui em diante é estimativa</span></div>);
      rowsTL.push(<div key={m} className={(m===1?'done':'') + (m===meses?' me':'')}><span>{mesLabel(m)}</span>
        <span>{m===meses ? `você · efetiva ${pe} ✔️` : `até a efetiva ${m*vel}`}</span></div>);
      prev = m;
    });
  }
  const tiles = [['var(--t2E9E5B)','var(--bEAF7EE)',mob.conv,'convocados'],['var(--tD64545)','var(--bFDEDED)',mob.desist,'desistências TD ❌'],['var(--tE0B100)','var(--bFFF8D6)',mob.pend,'pendências TD ⏳'],
    ['var(--t2E5AAC)','var(--bEAF1FC)',mob.mig,mob.mig===1 ? 'migração ↔️' : 'migrações ↔️'],['var(--tE8731A)','var(--bFFF1E2)',mob.sai,'Sai AC'],['var(--tE8731A)','var(--bFFF1E2)',mob.prov,'PROV. ANAL ⚠️']];
  return (<>
    <Top bg="projecoes" kicker="Estimativas, não garantias" title="Projeções" sub={`Base de ${pt(TOTAL_GERAL)} convocações gerais · premissas conservadoras`}>
      <div className="kpi"><div><b>{real}</b><small>convocações<br/>em 5 meses</small></div><div><b>~{vel}</b><small>posições<br/>por mês</small></div>
        <div className="g"><b>{meses ? `≈ ${meses} meses` : '—'}</b><small>{meses ? `para a efetiva ${pe}` : (r && !r.fila ? 'fora da fila ativa' : 'escolha sua posição')}</small></div></div>
    </Top>
    <div className="body">
      <div className="cd"><div className="lab">Ajustar premissas</div>
        <div className="kv" style={{paddingTop:0}}><span>Base · convocações gerais (5 meses)</span><b>{pt(TOTAL_GERAL)}</b></div>
        <Slider label="% Região · 1ªR sobre o total" v={pr} set={setPr} res={n1} />
        <Slider label="% Técnico · dentro da 1ªR" v={pt_} set={setPt} res={n2} />
        <Slider label="% Hipo · reserva no Técnico" v={ph} set={setPh} res={real} />
        <div className="fx">{pt(TOTAL_GERAL)} × <b>{pr}%</b> × <b>{pt_}%</b> × <b>{ph}%</b> = <b style={{fontSize:15,color:'var(--t8A6D1D)'}}>{real}</b> convocações Hipo</div></div>
      {meses ? <div className="cd"><div className="lab">No ritmo real · ~{vel} por mês <span style={{textTransform:'none',letterSpacing:0,fontWeight:400}}>(premissas conservadoras)</span></div>
        <div style={{textAlign:'center',margin:'2px 0 10px'}}><div style={{fontSize:11.5,color:'var(--t5A6B7B)'}}>posição efetiva de Cl. {r.cl}</div>
          <div style={{fontFamily:"'DejaVu Serif',serif",fontSize:34,fontWeight:700,color:'var(--t2E5AAC)',lineHeight:1.1}}><span style={{fontSize:26,verticalAlign:3,marginRight:6}}>🗓</span>{pe}</div>
          <div style={{fontSize:13}}>seria alcançada em <b style={{color:'var(--t8A6D1D)'}}>≈ {meses} meses</b></div></div>
        <div className="tl2">{rowsTL}</div></div>
      : <div className="cd emp" style={{padding:18}}><div className="ic">📈</div>{vel===0 && pe ? 'Sem projeção com essas premissas (0 convocações por mês).' : r && !r.fila ? 'Este candidato está fora da fila ativa.' : <>Escolha uma classificação da fila na aba <b>Posições</b> para ver em quantos meses ela seria alcançada.</>}</div>}
      <div className="cd"><div className="lab">Mobilidade da lista · atualizada em {updated ? dmy(updated) : '30/10'}</div>
        <div className="tiles" style={{marginTop:0}}>{tiles.map(([c,bg,v,t]) => <div key={t} className="tile" style={{background:bg,borderColor:c}}><b style={{color:c}}>{v}</b><span>{t}</span></div>)}</div>
        <div style={{textAlign:'center',fontSize:11.5,color:'var(--t7A8896)',marginTop:9}}>{mob.fila} na fila ativa · {ROWS.length} aprovados</div></div>
      <div className="gray"><div><div className="t">Global ilustrativo · não usar p/ 1ªR</div><div className="s">blend único de 8% sobre {pt(TOTAL_GERAL)}</div></div><div><b>{glob}</b> <span style={{fontSize:11}}>· ~{Math.round(glob/5)}/mês</span></div></div>
    </div>
  </>);
}

// ---------- ABA SIMULADOR ----------
const GRUPOS = ['G1/G2','G3','G4','G5','G6','G7','G8','G9','G10','G11','G12'];
const GCOL = ['#1F3B57','#1F3B57','#1F3B57','#1F3B57','#1F3B57','#2E5AAC','#0F766E','#B8860B','#1E6B3A','#B83280','#64748B'];
// Arredondamento: se a casa das unidades for 6 ou mais, soma-se +1 (16→17, 26→27, 36→37…)
const adj = n => (n % 10) >= 6 ? 1 : 0;
const gcount = (rows, g) => rows.filter(r => r.status.startsWith('CONVOCADO '+g+' ')).length;

function Simulador({cl, setCl}){
  const {ROWS, QMAP, MAXQ, PEND, migN, desN, reps, ult, updated} = useData();
  const [nom, setNom] = useState(NOM0);
  const counts = GRUPOS.map(g => gcount(ROWS, g));
  let lastG = 3; counts.forEach((c,i) => { if (c>0 && i>lastG) lastG = i; });   // mostra G1–G5 e, se houver, os grupos seguintes
  const shown = GRUPOS.slice(0, lastG+1);
  const totG = counts.slice(0, lastG+1).reduce((a,b)=>a+b, 0);
  const simIdx = []; for (let i=lastG+1; i<GRUPOS.length; i++) simIdx.push(i);
  const labs = simIdx.map(i => GRUPOS[i]), cols = simIdx.map(i => GCOL[i]);
  const eff = simIdx.map(i => nom[i] + adj(nom[i]));
  const acc = []; eff.reduce((s,n,i)=>(acc[i]=s+n, s+n), 0);
  const TOT = acc.length ? acc[acc.length-1] : 0;
  const DES = TOT>0 ? TOT + PEND : 0;
  const R = TOT>0 ? QMAP[Math.min(TOT,MAXQ)] : null;
  const RD = TOT>0 ? QMAP[Math.min(DES,MAXQ)] : null;
  const me = ROWS.find(x => x.cl===cl);
  const USERQ = me && me.fila ? me.pe : null;
  const prevIdx = USERQ!=null && TOT>0 ? acc.findIndex(a => a>=USERQ) : -1;
  const setN = (i, d) => setNom(nom.map((v,j) => j===i ? Math.max(0, Math.min(300, v+d)) : v));
  const [draft, setDraft, go] = useDraft(cl, setCl);
  const cells = [];
  for (let p=1; p<=MAXQ; p++){
    let bg;
    if (p<=TOT) bg = cols[acc.findIndex(a => p<=a)];
    else if (p<=DES) bg = 'repeating-linear-gradient(45deg,#674EA7 0 2px,transparent 2px 4px)';
    else bg = 'var(--bE7E3D6)';
    const st = {background:bg};
    if (p===USERQ){ st.outline='2px solid var(--l8A6D1D)'; st.outlineOffset='1px'; st.position='relative'; st.zIndex=2; }
    cells.push(<i key={p} style={st} />);
  }
  const kp3 = USERQ==null ? <><b>—</b><small>{cl!=null ? 'fora da fila ativa' : 'informe sua posição'}</small></>
    : prevIdx>=0 ? <><b>{labs[prevIdx]}</b><small>sua chamada prevista<br/>(ef. {USERQ})</small></>
    : <><b>{TOT>0 ? 'além' : '—'}</b><small>{TOT>0 ? 'do cenário simulado' : 'defina as nomeações'}<br/>(ef. {USERQ})</small></>;
  const sub = updated ? `Atualizado pelo moderador em ${dmyhm(updated)}` : 'Dados atualizados em 30/10/2026 · cota Hipo 1ªR';
  return (<>
    <Top bg="simulador" kicker="Cota Hipossuficiência · 1ª Região" title="Simulador de Convocações" sub={sub}>
      <div className="pick"><div className="in" style={{padding:0,background:'none'}}>
        <input type="number" min="1" max={ROWS.length} value={draft} placeholder="Digite sua classificação oficial"
          onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')go();}} /></div>
        <button className="go" onClick={go}>Simular</button></div>
      <div className="kpi"><div><b>{totG}</b><small>convocações<br/>realizadas</small></div><div><b>{MAXQ}</b><small>na fila<br/>efetiva</small></div><div className="g">{kp3}</div></div>
    </Top>
    <div className="body">
      <div className="cd"><div className="lab">Resultado do cenário simulado</div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
          <div style={{fontFamily:"'DejaVu Serif',serif",fontWeight:700,fontSize:54,lineHeight:1,color:'var(--t1F3B57)'}}>{TOT}</div>
          <div style={{textAlign:'right',fontSize:12,color:'var(--t5A6B7B)',lineHeight:1.45}}>nomeações simuladas<br/>alcança <b style={{color:'var(--t1A2733)'}}>{Math.round(TOT/MAXQ*100)}%</b> da fila efetiva<br/>({TOT} de {MAXQ})</div></div>
        <div className="map">{cells}</div>
        <div className="lg">{labs.map((g,i)=><span key={g}><i style={{background:cols[i]}}></i>{g}</span>)}
          <span><i style={{background:'#674EA7'}}></i>+{PEND} reposições pendentes</span><span><i style={{background:'var(--bE7E3D6)'}}></i>além</span>
          {USERQ!=null && <span><i style={{background:'#8A6D1D'}}></i>você (ef. {USERQ})</span>}</div>
        <div className="res2">
          <div className="rt n"><div className="k">Último alcançado</div><div className="v">{R ? `Cl. ${R.cl}` : '—'}</div><div className="s">{R ? R.nome : ''}</div></div>
          <div className="rt g"><div className="k">Com reposições pendentes</div><div className="v">{RD ? `até Cl. ${RD.cl}` : '—'}</div><div className="s">{RD ? RD.nome : ''}</div></div></div></div>
      <div className="cd" style={{borderLeft:'5px solid var(--l674EA7)'}}><div className="lab" style={{color:'var(--t674EA7)'}}>Reposições pendentes</div>
        <div className="eqr"><div className="q" style={{background:'var(--bEAF1FC)',color:'var(--t2E5AAC)'}}><b>{migN}</b><small>{migN===1?'migração':'migrações'} ↔️</small></div><span>+</span>
          <div className="q" style={{background:'var(--bFDEDED)',color:'var(--tD64545)'}}><b>{desN}</b><small>desist. TD ❌</small></div><span>−</span>
          <div className="q" style={{background:'var(--bEFEAF8)',color:'var(--t674EA7)'}}><b>{reps}</b><small>{reps===1?'reposição feita':'reposições feitas'} ↻</small></div><span>=</span>
          <div className="q" style={{background:'var(--b674EA7)',color:'var(--tFFFFFF)'}}><b>{PEND}</b><small>{PEND===1?'pendente':'pendentes'}</small></div></div>
        <div style={{fontSize:10.5,color:'var(--t7A8896)',marginTop:9,lineHeight:1.35}}>Cada pendente é uma vaga que o Tribunal ainda vai repor, e por isso avança a fila. Contam só os candidatos que já foram chamados (até a Cl. {ult}). PROV. ANAL entram apenas quando confirmados como Desistência TD (exceto o último chamado oficial, que já conta como saída). Sai AC não entra na conta: a contagem já começa a partir da Cl. 2 (Shanti).</div></div>
      <div className="cd"><div className="lab">Nº de convocações realizadas · (G1-G{lastG+2})</div>
        <div className="grp5" style={{gridTemplateColumns:`repeat(auto-fit,minmax(40px,1fr))`}}>
          {shown.map((g,i) => <div key={g}><b>{counts[i]}</b><small>{g}</small></div>)}<div className="tt"><b>{totG}</b><small>total</small></div></div></div>
      <div className="cd"><div className="lab">Simular novas convocações · {labs.length ? `(${labs[0]}-${labs[labs.length-1]})` : ''}</div>
        {labs.length===0 && <div className="empnote">Todas as chamadas até a G12 já foram realizadas.</div>}
        {simIdx.map((gi, k) => (
          <div className="nr" key={gi}>
            <div className="rl"><span className="dt" style={{background:GCOL[gi]}}></span>{GRUPOS[gi]}{adj(nom[gi])>0 && <span className="adj">+1 arred.</span>}<small>calendário a confirmar</small></div>
            <div className="stp"><button onClick={()=>setN(gi,-1)}>−</button><b>{nom[gi]}</b><button className="p" onClick={()=>setN(gi,1)}>+</button></div>
            <div className="ac">{acc[k]}</div>
          </div>))}</div>
      <div className="cd"><div className="lab">Premissas fixas (estimativas)</div>
        <div className="fx3"><span>Alternância Ampla : Hipo</span><span>6 : 1 · ≈ {TOT*6}</span></div>
        <div className="fx3"><span>Reposições pendentes</span><span>+{PEND} vagas · {DES} chamadas</span></div>
        <div className="fx3"><span>Conversor 9.1.1 (30 vagas)</span><span>→ 3 à Hipo</span></div>
        <div style={{fontSize:10.5,color:'var(--t7A8896)',marginTop:8}}>Arredondamento: unidade ≥ 6 soma +1 (ex.: 18 → 19). Premissas de cenário, não regras confirmadas. Calendário das chamadas a confirmar.</div></div>
    </div>
  </>);
}

// ---------- APP ----------
const b64e = s => btoa(unescape(encodeURIComponent(s)));
const b64d = s => decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
const GH = tk => ({Authorization: 'Bearer ' + tk, Accept: 'application/vnd.github+json'});
const TABS = [['lista','Lista','📋'],['posicoes','Posições','🎯'],['projecoes','Projeções','📈'],['simulador','Simulador','🧮']];
const clampN = (v, lo, hi) => { const n = parseInt(v,10); return (n>=lo && n<=hi) ? n : null; };

function App(){
  const [tab, setTab] = useState('lista');
  const [cl, setCl] = useState(null);                                          // nenhuma posição pré-selecionada
  const [remote, setRemote] = useState({over:{}, rp:{}, ult:ULT0, reps:REPS0, updated:null});   // o que todos veem
  const [pending, setPending] = useState({}), [pendRp, setPendRp] = useState({});               // alterações do moderador ainda não publicadas
  const [ultP, setUltP] = useState(null), [repsP, setRepsP] = useState(null);
  const [token, setToken] = useState(() => { try { return localStorage.getItem('hipo_mod') || ''; } catch(e) { return ''; } });
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  const toggleTheme = () => setTheme(t => {
    const n = t === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n);
    try { localStorage.setItem('hipo_theme', n); } catch(e) {}
    const m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', n === 'dark' ? '#0B121B' : '#1F3B57');
    return n;
  });
  const [busy, setBusy] = useState(false), [msg, setMsg] = useState(''), [ok, setOk] = useState(false);

  const parse = j => ({over: cleanOver(j.over), rp: cleanRp(j.rp), ult: clampN(j.ult,1,DATA.length) || ULT0,
    reps: clampN(j.reps,0,20) != null ? clampN(j.reps,0,20) : REPS0, updated: j.updated || null});
  // lê o status.json publicado (visitantes e moderador)
  const load = async () => {
    try {
      const res = await fetch('status.json?t=' + Date.now(), {cache:'no-store'});
      if (!res.ok) return;
      const j = await res.json();
      setRemote(cur => (j.updated && cur.updated && j.updated < cur.updated) ? cur : parse(j));
    } catch(e) {}
  };
  useEffect(() => {
    load();
    const iv = setInterval(load, 90000);
    const vis = () => { if (document.visibilityState === 'visible') load(); };
    document.addEventListener('visibilitychange', vis);
    return () => { clearInterval(iv); document.removeEventListener('visibilitychange', vis); };
  }, []);

  const over = useMemo(() => cleanOver({...remote.over, ...pending}), [remote, pending]);
  const rp = useMemo(() => cleanRp({...remote.rp, ...pendRp}), [remote, pendRp]);
  const ult = ultP != null ? ultP : remote.ult;
  const repsIn = repsP != null ? repsP : remote.reps;
  const data = useMemo(() => build(over, rp, ult, repsIn), [over, rp, ult, repsIn]);
  const nPend = Object.keys(pending).length + Object.keys(pendRp).length + (ultP!=null ? 1 : 0) + (repsP!=null ? 1 : 0);

  const mod = {
    on: !!token, busy, msg, ok, nPend, ult, reps: data.reps, pendOver: pending, pendRp,
    setStatus: (c, st) => {
      const curSt = remote.over[c] != null ? remote.over[c] : BASE[c];
      setMsg('');
      setPending(p => { const n = {...p}; if (st === curSt) delete n[c]; else n[c] = st; return n; });
    },
    setRep: (c, v) => {
      const n = clampN(v,0,20); if (n==null) return;
      const curRp = remote.rp[c] != null ? remote.rp[c] : BASEREP[c];
      setMsg('');
      setPendRp(p => { const q = {...p}; if (n === curRp) delete q[c]; else q[c] = n; return q; });
    },
    setUlt: v => { const n = clampN(v,1,DATA.length); if (n!=null) { setMsg(''); setUltP(n === remote.ult ? null : n); } },
    setReps: v => { const n = clampN(v,0,20); if (n!=null) { setMsg(''); setRepsP(n === remote.reps ? null : n); } },
    discard: () => { setPending({}); setPendRp({}); setUltP(null); setRepsP(null); setMsg(''); },
    logout: () => { try { localStorage.removeItem('hipo_mod'); } catch(e) {} setToken(''); mod.discard(); },
    login: async tk => {
      setBusy(true); setMsg('');
      try {
        const r = await fetch(`https://api.github.com/repos/${REPOS}`, {headers: GH(tk)});
        if (!r.ok) throw new Error('Token inválido ou sem acesso a este repositório.');
        const j = await r.json();
        if (!(j.permissions && j.permissions.push)) throw new Error('Este token não tem permissão de escrita.');
        try { localStorage.setItem('hipo_mod', tk); } catch(e) {}
        setToken(tk);
      } catch(e) { setOk(false); setMsg(e.message || 'Erro ao entrar.'); }
      finally { setBusy(false); }
    },
    reset: () => mod.publish(true),
    publish: async (resetAll) => {
      resetAll = resetAll === true;
      setBusy(true); setMsg('');
      try {
        const url = `https://api.github.com/repos/${REPOS}/contents/${FILE}`;
        for (let attempt = 0; attempt < 2; attempt++) {
          let sha, cur = {};
          const g = await fetch(url + '?ref=main&t=' + Date.now(), {headers: GH(token), cache:'no-store'});
          if (g.ok) { const j = await g.json(); sha = j.sha; try { cur = JSON.parse(b64d(j.content)); } catch(e) {} }
          else if (g.status !== 404) throw new Error(g.status===401||g.status===403 ? 'Sem permissão para publicar. Verifique o token.' : `Falha ao ler o arquivo (${g.status}).`);
          const over2 = resetAll ? {} : cleanOver({...(cur.over || {}), ...pending});
          const rp2 = resetAll ? {} : cleanRp({...(cur.rp || {}), ...pendRp});
          Object.keys(rp2).forEach(k => { if (!(over2[k] || BASE[k]).includes('CONVOCADO')) delete rp2[k]; });   // reposição só vale para convocado
          const body = {v:2, ult: resetAll ? ULT0 : ultP != null ? ultP : (clampN(cur.ult,1,DATA.length) || remote.ult),
            reps: resetAll ? REPS0 : repsP != null ? repsP : (clampN(cur.reps,0,20) != null ? clampN(cur.reps,0,20) : remote.reps),
            over: over2, rp: rp2, updated: new Date().toISOString()};
          const p = await fetch(url, {method:'PUT', headers: {...GH(token), 'Content-Type':'application/json'},
            body: JSON.stringify({message:'Atualiza status (moderador)', content: b64e(JSON.stringify(body, null, 1)), sha, branch:'main'})});
          if (p.ok) {
            setRemote({over: over2, rp: rp2, ult: body.ult, reps: body.reps, updated: body.updated});
            setPending({}); setPendRp({}); setUltP(null); setRepsP(null);
            setOk(true); setMsg(resetAll ? 'Dados da planilha restaurados para todos (cerca de 1 minuto).' : 'Publicado! Aparece para todos em cerca de 1 minuto.'); return;
          }
          if (p.status !== 409 && p.status !== 422) throw new Error(p.status===401||p.status===403||p.status===404 ? 'Sem permissão para publicar. Verifique o token.' : `Falha ao publicar (${p.status}).`);
        }
        throw new Error('Outra alteração foi publicada ao mesmo tempo. Toque em Publicar de novo.');
      } catch(e) { setOk(false); setMsg(e.message || 'Erro ao publicar.'); }
      finally { setBusy(false); }
    },
  };

  const pick = c => { setCl(c); setTab('posicoes'); window.scrollTo(0,0); };
  const go = k => { setTab(k); window.scrollTo(0,0); };
  const step = d => { const i = TABS.findIndex(t => t[0] === tab); go(TABS[(i + d + TABS.length) % TABS.length][0]); };
  return (
    <DataCtx.Provider value={{...data, ult, updated: remote.updated, mod, thm: {theme, toggle: toggleTheme}}}>
      <div className="app">
        <div className="arw"><div>
          <button aria-label="Aba anterior" title="Aba anterior" onClick={()=>step(-1)}><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button aria-label="Próxima aba" title="Próxima aba" onClick={()=>step(1)}><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div></div>
        <div style={{display: tab==='lista' ? 'block' : 'none'}}><Lista onPick={pick} /></div>
        <div style={{display: tab==='posicoes' ? 'block' : 'none'}}><Posicoes cl={cl} setCl={setCl} /></div>
        <div style={{display: tab==='projecoes' ? 'block' : 'none'}}><Projecoes cl={cl} /></div>
        <div style={{display: tab==='simulador' ? 'block' : 'none'}}><Simulador cl={cl} setCl={setCl} /></div>
        <div className="nav">{TABS.map(([k,l,ic]) =>
          <button key={k} className={tab===k?'on':''} onClick={()=>go(k)}><i>{ic}</i>{l}</button>)}</div>
      </div>
    </DataCtx.Provider>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
